<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
<!-- Navbar -->
<nav class="bg-blue-600 text-white p-4 shadow-md">
  <div class="max-w-6xl mx-auto flex justify-between items-center">
    
    <h1 class="text-2xl font-bold">
      Student Task Tracker
    </h1>

    <ul class="flex gap-6">
      <li>
        <a href="#" class="hover:text-gray-200 transition">
          Home
        </a>
      </li>

      <li>
        <a href="#" class="hover:text-gray-200 transition">
          Tasks
        </a>
      </li>
    </ul>

  </div>
</nav>
<!-- Hero Section -->
<section class="bg-white py-16 px-4 text-center">

  <h2 class="text-4xl md:text-5xl font-bold mb-4">
    Stay Organized With Your School Tasks
  </h2>

  <p class="text-gray-600 max-w-2xl mx-auto text-lg">
    Add your tasks, manage deadlines, and stay productive every day.
  </p>

</section>
<!-- Task Form Section -->
<section class="max-w-2xl mx-auto px-4 py-10">

  <form
    id="taskForm"
    class="bg-white p-6 rounded-xl shadow-md space-y-4"
  >

    <!-- Task Input -->
    <input
      type="text"
      id="taskInput"
      placeholder="Enter task name"
      class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <!-- Date Input -->
    <input
      type="date"
      id="dateInput"
      class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
    />

    <!-- Error Message -->
    <p
      id="errorMessage"
      class="text-red-500 text-sm hidden"
    >
      Please fill in all fields.
    </p>

    <!-- Button -->
    <button
      type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 transition text-white py-3 rounded-lg font-semibold"
    >
      Add Task
    </button>

  </form>

</section>
</body>
</html>
